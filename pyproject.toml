[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_weather"
version = "0.0.1"
description = "Demos are designed to provide an interactive learning experience over the AI weather training program, including the Rainy season Onset Metrics Package (ROMP), so we can move from concepts to pilot evaluation as part of an international community of practice."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"

authors = [
  { name = "HCWF" },
  { name = "Mesfin Diro", email = "mesfin.diro@aau.edu.et" }
]

classifiers = [
    "Programming Language :: Python :: 3"
]

dependencies = [
    # --- ai_weather / Dashboard / Streamlit dependencies ---
    "jupytext>=1.19.5",
    "streamlit",
    "fpdf2",
    "ipywidgets",
    "python-dotenv",
    "Pillow",
    # --- MOMP / ROMP scientific dependencies ---
    "numpy",
    "pandas",
    "xarray",
    "matplotlib",
    "geopandas",
    "netcdf4",
    "scipy",
    "seaborn",
    "regionmask",
    "zarr",
    "cartopy",
    "fsspec==2025.3.2.*",
    "jupyterlab>=4.6.4",
    "git-filter-repo>=2.47.0",
    "plotly>=7.1.0",
    "google-cloud-storage>=3.16.0",
    "gcsfs>=2025.3.2",
]

[project.optional-dependencies]
dev = [
    "dask",
    "pytest",
    "jupyterlab",
    "black",
    "ruff",
    "ipython",
    "gcsfs",
]

[project.scripts]
momp-run = "momp.driver:run_momp"

[tool.setuptools]
# Top-level .py files in the project root
py-modules = ["config", "dataset", "features", "plots", "utils"]
include-package-data = true

[tool.setuptools.package-data]
momp = ["params/config.in", "params/*.in"]
"*" = ["*.css", "*.html", "*.json"]

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | data
  | \.mplcache
)/
'''

[tool.ruff.lint.isort]
known_first_party = ["ai_weather", "momp", "apps", "config", "ui"]
force_sort_within_sections = true
