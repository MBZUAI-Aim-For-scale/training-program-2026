services:
  lab:
    image: nvcr.io/nvidia/pytorch:25.03-py3
    ipc: host
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - "./:/workspace"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - "jupyter"
      - "lab"
      - "--ip=0.0.0.0"
      - "--allow-root"
      - "--no-browser"
      - "--ServerApp.token="
      - "--ServerApp.password="
