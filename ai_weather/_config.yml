# ============================================================
# AI WEATHER - Complete Configuration
# ============================================================

# --- Site Metadata ---
title: "AI Weather Forecasting"
description: "A modern lesson on AI applications in weather forecasting using Python"
email: "training@uchicago.edu"
author: "HCWF"

# --- URLs ---
# Update these for your actual deployment
url: "https://mesfindiro.github.io"
baseurl: "/ai_weather"  

# --- Repository ---
repository: "mesfindiro/ai_weather"

# --- Build Settings ---
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    block:
      line_numbers: false
  smart_quotes: ["apos", "apos", "quot", "quot"]

# --- Collections ---
collections:
  episodes:
    output: true
    permalink: /:slug/

# --- Default Front Matter ---
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "episodes"
    values:
      layout: "default"

# --- Plugins ---
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# --- Exclusions ---
exclude:
  - Makefile
  - bin/
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - requirements.txt
  - README.md
  - CONTRIBUTING.md
  - CITATION
  - "*.map"

# --- Features ---
mathjax: true

# --- Timezone ---
timezone: "Africa/Addis_Ababa"