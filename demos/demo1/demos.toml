# What demo1 sets up on a Spark: host checks first, then one Docker container per demo.
# Paths are relative to the ai_weather repo root. Add a [[demo]] block to track a new demo.
#
# Each demo gets three steps: build its image (skipped if the image exists, unless
# `spark_setup.py run --rebuild`), start its container with `run`, and wait for its
# Streamlit health endpoint on 127.0.0.1:<port> (or for the page at `health`, if the
# container isn't a Streamlit app). Every demo needs its own port.

[dashboard]
port = 8500

# Smoke test from Untitled.ipynb: CUDA matmul + flash-attention inside an NGC container
[smoke_test]
image = "nvcr.io/nvidia/pytorch:25.03-py3"

# Demo 2's CDT tool: the R/Tk GUI on a virtual desktop, shown in the browser by noVNC
[[demo]]
id = "cdt"
title = "Demo 2 · Climate Data Tools (CDT)"
image = "cdt"
container = "cdt"
context = "demos/demo2/CDT"
dockerfile = "demos/demo2/CDT/Dockerfile"
run = ["bash", "demos/demo2/docker/run.sh"]
port = 8504
health = "/vnc.html"

[[demo]]
id = "demo3"
title = "Demo 3 · AI forecast lab"
image = "demo3"
container = "demo3"
context = "demos/demo3"
dockerfile = "demos/demo3/docker/Dockerfile"
run = ["bash", "demos/demo3/docker/run.sh"]
port = 8502

[[demo]]
id = "demo4"
title = "Demo 4 · Forecasting & benchmarking"
image = "ai_weather"
container = "ai_weather"
context = "."
dockerfile = "demos/demo4/docker/Dockerfile"
run = ["bash", "demos/demo4/docker/run.sh", "start"]
port = 8501
