# What demo1 sets up on a Spark: host checks first, then one Docker container per demo.
#
# Ports: this file is the one place they're set. spark_setup.py passes each demo its
# `port` as PORT, and every demo's start script uses it (with the same number as its
# default, for running it by hand). All on 127.0.0.1 only. In use:
#   8500  this dashboard              8504  Demo 2 (CDT, noVNC)
#   8501  the repo's top-level app    8505  Demo 5 (ForecastCheck)
#   8502  Demo 3                      8888  Demo 4's Jupyter Lab (demos/demo4/docker)
#   8503  Demo 4                      8889  Demo 1's JupyterLab sandbox (docker-compose.yml)
#   8506  Intro to Spark (JupyterLab)  8765  AI Almanac (its own default)
# A new demo takes the next free one (8507, ...). A person's own intro-to-Spark JupyterLab
# (Lab 00: run.sh <port>) uses one outside these, 8890 and up.
# Paths are relative to the ai_weather repo root. Add a [[demo]] block to track a new demo.
#
# Each demo gets three steps: build its image (skipped while the image is up to date with
# its code, unless `spark_setup.py run --rebuild`), start its container with `run`, and wait
# for its Streamlit health endpoint on 127.0.0.1:<port> (or for the page at `health`, if the
# container isn't a Streamlit app). Every demo needs its own port. `--build-only` does the
# first step only.
#
# "Up to date with its code": the image is labelled with a fingerprint of the committed
# files it's built from, its `watch` paths (repo-relative; default: `context` and
# `dockerfile`). When a pull changes any of them, the next run rebuilds it. List the files
# the Dockerfile copies when the context is bigger than that (as Demo 4's is), so unrelated
# commits don't rebuild it.

[dashboard]
port = 8500

# The command `spark-setup` (in ~/.local/bin): this setup, demos/demo1/spark_setup.py, from
# any folder (`spark-setup dashboard`, `spark-setup --only demo3`, ...). Every run installs it.
[setup]
command = { name = "spark-setup", script = "demos/demo1/spark_setup.py" }

# Smoke test from Untitled.ipynb: CUDA matmul + flash-attention inside an NGC container
[smoke_test]
image = "nvcr.io/nvidia/pytorch:25.03-py3"

# Demo 2's CDT tool: the R/Tk GUI on a virtual desktop, shown in the browser by noVNC
[[demo]]
id = "cdt"
title = "Demo 2 · Climate Data Tools (CDT)"
image = "cdt"
container = "cdt"
context = "demos/demo2/CDT"
dockerfile = "demos/demo2/CDT/Dockerfile"
run = ["bash", "demos/demo2/docker/run.sh"]
port = 8504
health = "/vnc.html"

[[demo]]
id = "demo3"
title = "Demo 3 · AI forecast lab"
image = "demo3"
container = "demo3"
context = "demos/demo3"
dockerfile = "demos/demo3/docker/Dockerfile"
run = ["bash", "demos/demo3/docker/run.sh"]
port = 8502

[[demo]]
id = "demo4"
title = "Demo 4 · Forecasting & benchmarking"
image = "ai_weather"
container = "ai_weather"
context = "."
dockerfile = "demos/demo4/docker/Dockerfile"
# What that Dockerfile copies (the context is the whole repo)
watch = ["demos/demo4", "run_momp.py", "setup.py", "setup.cfg", "pyproject.toml"]
run = ["bash", "demos/demo4/docker/run.sh", "start"]
port = 8503

# Demo 5's code is ForecastCheck's own repository: cloned into `path` (not part of this repo,
# see .gitignore) and pulled to the branch's newest commit on every setup run, so it stays
# up to date with it; the image is rebuilt when that commit changes. Its port isn't
# ForecastCheck's default 8502 (Demo 3's): demos/demo5/run.sh passes this one.
[[demo]]
id = "demo5"
title = "Demo 5 · Putting your forecast to the test (ForecastCheck)"
image = "forecastcheck"
container = "forecastcheck"
context = "demos/demo5/forecastcheck"
dockerfile = "demos/demo5/forecastcheck/docker/Dockerfile"
run = ["bash", "demos/demo5/run.sh", "start"]
port = 8505
source = { url = "https://github.com/africlimate-research/forecastcheck.git", branch = "main", path = "demos/demo5/forecastcheck" }
# The command `fcstcheck` (in ~/.local/bin): demos/demo5/run.sh, from any folder; also
# installed as `forecastcheck`, its long name.
command = { name = "fcstcheck", also = ["forecastcheck"], script = "demos/demo5/run.sh" }

# AI Almanac: its own repository, which the fleet clones into the home folder (`checkout`) and
# sets up after each pull (scripts/spark.sh update: its image, environments and local model,
# then stopped). Launch starts it with scripts/spark.sh up, which builds it if its code changed,
# so it has no build step here (and --build-only leaves it out). Its page needs the access token
# in its data folder (`token`: that file's KEY=value line), which the dashboard adds to its link.
# Its port is its own default, 8765 (spark.sh reads ALMANAC_PORT).
[[demo]]
id = "almanac"
title = "AI Almanac"
image = "ai-almanac:spark"
container = "ai-almanac-spark-almanac-1"
checkout = "~/ai-almanac"
# (what the dashboard tells you to run when it isn't there)
get = "git clone -b hcwf-demo-spark https://github.com/AI-Almanac/ai-almanac ~/ai-almanac"
run = ["sh", "scripts/spark.sh", "up"]
port = 8765
env = { ALMANAC_PORT = "8765" }
health = "/health"
token = { file = "~/.local/share/ai-almanac-spark/secrets.env", key = "SERVE_ACCESS_TOKEN" }
# (a fresh install sets itself up first: downloads of tens of GB, unless the fleet did it already)
start_timeout = 7200

# Intro to DGX Spark (demos/intro-to-spark): background docs and Africa-focused labs 00-13, as
# notebooks in JupyterLab. Its image (PyTorch + Earth2Studio) takes 30-60 minutes to build, so
# the fleet's unattended setup builds it ahead; its models (~35 GB) download on first use, into
# ~/.cache/spark-intro. Its page needs Jupyter's token, which run.sh start keeps in that folder.
# (A person's own JupyterLab, Lab 00's run.sh <port>, is separate: its own container and port.)
[[demo]]
id = "intro"
title = "Intro to DGX Spark"
image = "spark-intro"
container = "spark-intro"
context = "demos/intro-to-spark/docker"
dockerfile = "demos/intro-to-spark/docker/Dockerfile"
run = ["bash", "demos/intro-to-spark/docker/run.sh", "start"]
port = 8506
health = "/api"
token = { file = "~/.cache/spark-intro/jupyter.env", key = "JUPYTER_TOKEN" }
