services:
  lab:
    image: nvcr.io/nvidia/pytorch:25.03-py3
    devices: ["nvidia.com/gpu=all"]
    ipc: host
    ports: ["127.0.0.1:8888:8888"]
    volumes: ["./:/workspace"]
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--allow-root", "--no-browser",
              "--ServerApp.token=", "--ServerApp.password="]
