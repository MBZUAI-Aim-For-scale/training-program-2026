# Preserve the original docker/ project identity when using root entrypoints.
name: docker

services:
  ai_weather:
    build:
      context: ../../..
      dockerfile: demos/demo4/docker/Dockerfile
    image: ai_weather:latest
    container_name: ai_weather
    restart: unless-stopped
    ipc: host
    env_file:
      # Optional: without it, docker/run.sh's defaults apply (the program's bucket).
      - path: ../../../.env
        required: false
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]
    ports:
      - "127.0.0.1:${PORT:-8503}:8501" # Streamlit Dashboard (PORT: from demos/demo1/demos.toml)
      - "127.0.0.1:8888:8888" # Jupyter Lab (optional)
    healthcheck:
      test: ["CMD", "/opt/envs/app/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-/run/gcp-key.json}
      - ROMP_DEMO_OUT_DIR=/app/ai_weather/data/ROMP_OUT
      - DEMO_COUNTRY_DATA=/country_data
      # (run.sh exports them, from .env or its defaults)
      - DEMO_BUCKET=${DEMO_BUCKET:-aim4scale_training_2026}
      - DEMO3_BUCKET=${DEMO3_BUCKET:-gs://aim4scale_training_2026/demo3}
    volumes:
      # Code Mount (aligned with Dockerfile WORKDIR /app)
      - ..:/app
      # Repo-root files the app expects under /app
      - ../../../data:/app/data
      - ../../../run_momp.py:/app/run_momp.py
      # Host Output & Cache Mounts
      - ${OUTPUTS:-../outputs}:/app/outputs
      - ${ROMP_OUT:-../ai_weather/data/ROMP_OUT}:/app/ai_weather/data/ROMP_OUT
      - ${CACHE:-~/.cache/ai_weather}:/root/.cache
      # This Spark's country data, read before the bucket (run.sh sets COUNTRY_DATA; /dev/null if none)
      - ${COUNTRY_DATA:-/dev/null}:/country_data:ro
      # GCP Credentials Mount
      - ${GCP_KEY_PATH:-/dev/null}:${GOOGLE_APPLICATION_CREDENTIALS:-/run/gcp-key.json}:ro
